services:
  multi_tenancy_app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: multi_tenancy_app_container
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multi_tenancy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: pg_multi_tenancy_container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: multi_tenancy
    ports:
      - '5432:5432'
    volumes:
      - multi_tenancy_data:/var/lib/postgresql/data
    networks:
      - multi_tenancy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d multi_tenancy']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_multi_tenancy_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8080:80'
    networks:
      - multi_tenancy
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: redis_multi_tenancy_container
    ports:
      - '6379:6379'
    networks:
      - multi_tenancy
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight_multi_tenancy_container
    ports:
      - '5540:5540'
    networks:
      - multi_tenancy
    depends_on:
      redis:
        condition: service_healthy

networks:
  multi_tenancy:
    driver: bridge

volumes:
  multi_tenancy_data:
